name: Build RackTop

on:
  workflow_dispatch:
    inputs:
      build_linux:
        description: Build Ubuntu x64 packages
        required: true
        type: boolean
        default: true
      build_macos:
        description: Build macOS Apple Silicon packages
        required: true
        type: boolean
        default: true
      build_windows:
        description: Build Windows x64 packages
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/package-linux.sh'
      - 'scripts/smoke-linux.sh'
      - 'package*.json'
      - '.github/workflows/build.yml'
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: racktop-linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Read package version
        shell: bash
        run: |
          RACKTOP_VERSION="$(node -p "require('./package.json').version")"
          echo "RACKTOP_VERSION=$RACKTOP_VERSION" >> "$GITHUB_ENV"
      - run: npm run test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Import Apple Developer ID certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CONFIGURED_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ]; then
            if [ -n "$APPLE_CERTIFICATE_PASSWORD$NOTARY_APPLE_ID$NOTARY_APPLE_PASSWORD$NOTARY_APPLE_TEAM_ID" ]; then
              echo "Apple signing and notarization secrets are only partially configured." >&2
              exit 1
            fi
            echo "No Apple certificate configured; the artifact will be marked unsigned."
            echo "RACKTOP_MARK_UNSIGNED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$NOTARY_APPLE_ID" ] \
            || [ -z "$NOTARY_APPLE_PASSWORD" ] || [ -z "$NOTARY_APPLE_TEAM_ID" ]; then
            echo "A certificate and all Apple notarization secrets must be configured together." >&2
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/racktop-developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/racktop-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$CONFIGURED_SIGNING_IDENTITY"
          if [ -z "$SIGNING_IDENTITY" ]; then
            SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
              | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          fi
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "No Developer ID Application identity was found in APPLE_CERTIFICATE." >&2
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "RACKTOP_MARK_UNSIGNED=0" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, and verify macOS DMG
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RACKTOP_MACOS_TARGET: aarch64-apple-darwin
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run bundle:macos

      - name: Upload verified macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: RackTop_${{ env.RACKTOP_VERSION }}_macos-arm64-dmg
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.sha256
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.signing.txt

      - name: Upload verified macOS updater package
        uses: actions/upload-artifact@v4
        with:
          name: RackTop_${{ env.RACKTOP_VERSION }}_macos-arm64-updater
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  windows:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - name: Read package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "RACKTOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target x86_64-pc-windows-msvc --bundles msi,nsis
          uploadWorkflowArtifacts: false
      - name: Smoke-test Windows installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi' -Filter '*.msi' | Select-Object -First 1
          $nsis = Get-ChildItem 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $msi) { throw 'Windows build did not produce an MSI installer.' }
          if (-not $nsis) { throw 'Windows build did not produce an NSIS setup executable.' }

          $msiExtract = Join-Path $env:RUNNER_TEMP 'racktop-msi-extract'
          $msiArgs = "/a `"$($msi.FullName)`" /qn /norestart TARGETDIR=`"$msiExtract`""
          $msiProcess = Start-Process msiexec.exe -ArgumentList $msiArgs -Wait -PassThru
          if ($msiProcess.ExitCode -ne 0) { throw "MSI administrative install failed with exit code $($msiProcess.ExitCode)." }
          if (-not (Get-ChildItem $msiExtract -Recurse -Filter 'RackTop.exe' -ErrorAction SilentlyContinue)) {
            throw 'MSI did not contain RackTop.exe.'
          }

          $nsisInstall = Join-Path $env:RUNNER_TEMP 'racktop-nsis-install'
          $nsisProcess = Start-Process $nsis.FullName -ArgumentList "/S /D=$nsisInstall" -Wait -PassThru
          if ($nsisProcess.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($nsisProcess.ExitCode)." }
          $app = Get-ChildItem $nsisInstall -Recurse -Filter 'RackTop.exe' | Select-Object -First 1
          if (-not $app) { throw 'NSIS installation did not create RackTop.exe.' }

          $appProcess = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($appProcess.HasExited) { throw "Installed RackTop exited early with code $($appProcess.ExitCode)." }
          Stop-Process -Id $appProcess.Id -Force

          $uninstaller = Get-ChildItem $nsisInstall -Recurse -Filter 'uninstall.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'NSIS installation did not create an uninstaller.' }
          $uninstallProcess = Start-Process $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "NSIS uninstall failed with exit code $($uninstallProcess.ExitCode)." }

      - name: Upload verified Windows setup package
        uses: actions/upload-artifact@v4
        with:
          name: RackTop_${{ env.RACKTOP_VERSION }}_x64-setup
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig

      - name: Upload verified Windows MSI package
        uses: actions/upload-artifact@v4
        with:
          name: RackTop_${{ env.RACKTOP_VERSION }}_x64_zh-CN-msi
          if-no-files-found: error
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi

  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.build_linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev patchelf openssh-client xdg-utils xvfb xterm
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run bundle:linux
      - name: Verify packages and launch installed application
        run: bash scripts/smoke-linux.sh
      - name: Read version
        run: echo "RACKTOP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: RackTop_${{ env.RACKTOP_VERSION }}_linux-amd64-deb
          path: src-tauri/target/release/linux-packages/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: RackTop_${{ env.RACKTOP_VERSION }}_linux-x86_64-AppImage
          path: src-tauri/target/release/linux-packages/*.AppImage
          if-no-files-found: error

  release-linux:
    needs: linux
    if: github.ref == 'refs/heads/main' && github.repository == 'Zjj-Low-Key/RackTop-Linux'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: RackTop_*_linux-*
          path: linux-release
          merge-multiple: true
      - name: Publish verified Linux release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          deb="RackTop_${version}_linux-amd64.deb"
          appimage="RackTop_${version}_linux-x86_64.AppImage"
          test -s "linux-release/$deb"
          test -s "linux-release/$appimage"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          latest_notes=$(awk '
            /^## [0-9]/ {
              if (capturing) exit
              capturing=1
              next
            }
            capturing { print }
          ' docs/Version_overview.md)
          test -n "$latest_notes"
          {
            printf '## 主要更新\\n\\n%s\\n\\n## 下载\\n\\n' "$latest_notes"
            printf -- '- %s：Ubuntu 24.04 x64 安装包，推荐使用。\\n' "$deb"
            printf -- '- %s：Linux x86_64 便携程序，需要 WebKitGTK 4.1 和桌面会话；可用 --appimage-extract-and-run 在没有 FUSE 的系统启动。\\n' "$appimage"
          } > release-notes.md
          # A previous failed run may have left a draft with old build artifacts. Remove only that private draft.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          draft_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft == true and .tag_name == \"$tag\") | .id" | head -1)
          if [ -n "$draft_id" ]; then
            echo "Removing incomplete draft release $draft_id."
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$draft_id"
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "RackTop v$version 稳定版" --notes-file release-notes.md --draft "linux-release/$deb" "linux-release/$appimage"
          release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.draft == true and .tag_name == \"$tag\") | .id" | head -1)
          test -n "$release_id"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f draft=false -f prerelease=false -f make_latest=true >/dev/null
          for filename in "$deb" "$appimage"; do
            digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq ".assets[] | select(.name == \"$filename\") | .digest")
            expected="sha256:$(sha256sum "linux-release/$filename" | cut -d ' ' -f1)"
            test "$digest" = "$expected"
          done
          gh release download "$tag" --dir verified-download --pattern "$deb" --pattern "$appimage"
          cmp "linux-release/$deb" "verified-download/$deb"
          cmp "linux-release/$appimage" "verified-download/$appimage"
